<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lehar · Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="width: 100%; box-sizing: border-box; padding: 22px 16px; display: flex; flex-direction: column; gap: 18px; font-family: Manrope, system-ui, sans-serif; color: #E2EFEC; background: #0B4F4A; min-height: 1080px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<svg width="34" height="34" viewBox="0 0 32 32" role="img" aria-label="Lehar logo"><rect width="32" height="32" rx="9" fill="#ffffff"></rect><rect x="2" y="2" width="28" height="28" rx="7" fill="#0B4F4A"></rect><path d="M5 19c3.5 0 3.5-4 7-4s3.5 4 7 4 3.5-4 7-4" fill="none" stroke="#E8833A" stroke-width="3" stroke-linecap="round"></path><path d="M5 24c3.5 0 3.5-3 7-3s3.5 3 7 3 3.5-3 7-3" fill="none" stroke="#E2EFEC" stroke-width="2" stroke-linecap="round" opacity=".7"></path></svg>
<div>
<div style="font-size: 19px; font-weight: 800; color: #fff; letter-spacing: -0.2px">Lehar</div>
<div style="font-size: 11.5px; color: #B9D6D0; font-weight: 600">Konkan Coastal Foods</div>
</div>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 800; letter-spacing: 0.8px; color: #9CC7BF; padding: 0 10px 6px">{{g.label}}</div>
<sc-for list="{{g.items}}" as="item" hint-placeholder-count="3">
<a href="{{item.href}}" style="{{item.style}}">
<span style="{{item.dot}}"></span>
<span style="flex: 1">{{item.label}}</span>
<span style="{{item.badgeStyle}}">{{item.badge}}</span>
</a>
</sc-for>
</div>
</sc-for>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-radius: 12px; background: rgba(255,255,255,0.07)">
<span style="width: 36px; height: 36px; border-radius: 99px; background: #E8833A; color: #15212B; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">AP</span>
<div style="flex: 1; min-width: 0">
<div style="font-size: 13.5px; font-weight: 700; color: #fff">Amit Prabhu</div>
<div style="font-size: 11.5px; color: #B9D6D0">KCF0007 · Manager</div>
</div>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Home","My profile","Attendance","My leave","Ask HR","Approvals","Team","Recruitment","Performance","Employees","Reports","Settings"],"default":"Home"},"$preview":{"width":248,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Home';
    const mk = (label, href, badge) => {
      const on = label === active;
      return {
        label, href, badge: badge || '',
        style: 'display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:' + (on ? '800' : '600') + ';color:' + (on ? '#0B4F4A' : '#E2EFEC') + ';background:' + (on ? '#E2EFEC' : 'transparent'),
        dot: 'width:8px;height:8px;border-radius:3px;background:' + (on ? '#E8833A' : 'rgba(226,239,236,0.35)'),
        badgeStyle: badge ? 'font-size:11px;font-weight:800;border-radius:99px;padding:2px 8px;background:#E8833A;color:#15212B' : 'display:none'
      };
    };
    return {
      groups: [
        { label: 'ME', items: [mk('Home', 'Main.dc.html'), mk('My profile', 'Profile.dc.html'), mk('Attendance', 'Attendance.dc.html'), mk('My leave', 'ApplyLeave.dc.html'), mk('Ask HR', 'AskHR.dc.html')] },
        { label: 'MY TEAM', items: [mk('Approvals', 'Approvals.dc.html', '4'), mk('Team', 'Attendance.dc.html')] },
        { label: 'TALENT', items: [mk('Recruitment', 'Recruitment.dc.html'), mk('Performance', 'Performance.dc.html')] },
        { label: 'HR ADMIN', items: [mk('Employees', 'Directory.dc.html'), mk('Reports', 'Reports.dc.html'), mk('Settings', 'Main.dc.html')] }
      ]
    };
  }
}
</script>
</body>
</html>
