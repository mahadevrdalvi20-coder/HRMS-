<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lehar · Recruitment pipeline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;font-family:Manrope,system-ui,sans-serif;color:#15212B;background:#F4F3EE}
a{color:#0B4F4A}a:hover{color:#083a36}
.card{background:#fff;border:1px solid #E3E1DA;border-radius:16px;padding:18px}
.cap{font-size:12.5px;color:#55606A;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer}
.req{font:inherit;text-align:left;background:#fff;border:1px solid #E3E1DA;border-radius:14px;padding:14px 16px;min-width:220px;cursor:pointer;flex:0 0 auto}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1080px; background: #F4F3EE">
<div style="flex: 1 1 248px; max-width: 100%; background: #0B4F4A">
<dc-import name="Sidebar" active="Recruitment" hint-size="248px,1080px"></dc-import>
</div>
<main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box">
<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
<div>
<p class="cap" style="margin: 0 0 4px">Recruitment · HR sees all · hiring managers see their own roles, with no salary details</p>
<h1 style="margin: 0; font-size: 28px; font-weight: 800">Hiring pipeline</h1>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<button class="btn" style="background: #fff; border: 1px solid #E3E1DA">Careers page</button>
<button class="btn" style="background: #fff; border: 1px solid #E3E1DA">+ Add candidate</button>
<button class="btn" style="background: #0B4F4A; color: #fff; border: 0">+ New requisition</button>
</div>
</header>

<section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px">
<div class="card"><span class="cap">Open roles</span><div style="font-size: 26px; font-weight: 800">4 <span class="cap">· 7 openings</span></div></div>
<div class="card"><span class="cap">Active candidates</span><div style="font-size: 26px; font-weight: 800">38</div></div>
<div class="card"><span class="cap">Avg time to hire</span><div style="font-size: 26px; font-weight: 800">27 days</div></div>
<div class="card"><span class="cap">Offer accept rate</span><div style="font-size: 26px; font-weight: 800">78%</div></div>
<div class="card"><span class="cap">Top source</span><div style="font-size: 20px; font-weight: 800; padding-top: 4px">Employee referral</div></div>
</section>

<div style="display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px">
<button class="req" style="border: 2px solid #0B4F4A; background: #E2EFEC"><div style="font-weight: 800">QA Chemist</div><div class="cap">Quality · Verna · 2 openings</div><div class="cap" style="color: #9A4A12; font-weight: 700; margin-top: 4px">Needed by 15 Dec</div></button>
<button class="req"><div style="font-weight: 800">Machine Operator</div><div class="cap">Production · Verna · 3 openings</div></button>
<button class="req"><div style="font-weight: 800">Sales Executive – Export</div><div class="cap">Sales · Panaji · 1 opening</div></button>
<button class="req"><div style="font-weight: 800">Accounts Assistant</div><div class="cap">Finance · Panaji · 1 opening</div></button>
</div>

<section style="display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px">
<sc-for list="{{cols}}" as="col" hint-placeholder-count="5">
<div style="background: #ECEAE3; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 520px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 2px 4px">
<b style="font-size: 14px">{{col.name}}</b>
<span class="pill" style="background: #fff; color: #55606A">{{col.count}}</span>
</div>
<sc-for list="{{col.cards}}" as="c" hint-placeholder-count="3">
<a href="Candidate.dc.html" style="background: #fff; border: 1px solid #E3E1DA; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #15212B">
<div style="display: flex; justify-content: space-between; gap: 8px"><b style="font-size: 14px">{{c.name}}</b><span style="font-size: 12px; color: #9A4A12; font-weight: 800">{{c.score}}</span></div>
<span class="cap">{{c.meta}}</span>
<span style="{{c.tagStyle}}">{{c.tag}}</span>
</a>
</sc-for>
</div>
</sc-for>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const tag = (t, kind) => ({ tag: t, tagStyle: 'align-self:flex-start;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;' + ({ g: 'background:#DDF1E5;color:#17663F', a: 'background:#FFF1C7;color:#7A5200', b: 'background:#E1E9FA;color:#2A50A8', t: 'background:#E2EFEC;color:#0B4F4A', r: 'background:#FFE6D2;color:#A3410A' })[kind] });
    const c = (name, meta, score, t, k) => Object.assign({ name, meta, score }, tag(t, k));
    return {
      cols: [
        { name: 'Applied', count: 12, cards: [
          c('Rhea Fernandes', 'MSc Chemistry · 2 yrs · Naukri', '', 'New today', 'b'),
          c('Tanvi Kudalkar', 'BSc Food Tech · fresher · Careers page', '', 'Referral: Meera S.', 't'),
          c('Akash Gawas', 'MSc · 4 yrs · LinkedIn', '', 'Notice 60 days', 'a')
        ]},
        { name: 'Screening', count: 6, cards: [
          c('Siddhi Naik', 'MSc · 3 yrs · Walk-in', '', 'Call scheduled', 'b'),
          c('Omkar Desai', 'BSc · 5 yrs · Referral', '', 'Notice 30 days', 'a')
        ]},
        { name: 'Interview', count: 4, cards: [
          c('Pallavi Gaonkar', 'MSc · 3 yrs · Naukri', '4.5', 'Round 2 · Thu 11:00', 'b'),
          c('Nikhil Sardesai', 'MSc · 6 yrs · LinkedIn', '3.8', 'Feedback pending', 'r')
        ]},
        { name: 'Offer', count: 1, cards: [
          c('Shruti Kamat', 'MSc · 4 yrs · Referral', '4.6', 'Offer sent · 3 days', 'a')
        ]},
        { name: 'Hired', count: 1, cards: [
          c('Joanne D’Souza', 'Joins 1 Dec · Verna', '4.4', 'Create employee', 'g')
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
